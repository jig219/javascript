<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Design by foolishdeveloper.com -->
    <title>Shortner URL</title>
 
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <form id="shorten-form">
        <h3>Shortner URL</h3>

        <label for="enterurl">Enter url</label>
        <input type="url" class="form-control" name="url" id="url" placeholder="Enter URL">

        <label for="shortcode">Enter Shortcode</label>
        <input type="text" class="form-control" name="shortcode" id="shortcode" placeholder="Enter Shortcode">

        <button type="submit">Shortner</button>
        <h5 style="color: beige;" class="mt-1">Shortened URLs</h5>
        <ul style="list-style: none;" id="shortened-urls"></ul>
    </form>
    <script>
        const fetchShortenedURL = async () => {
            const response = await fetch("/links");
            const links = await response.json();
            console.log("links",links);
            
            const list = document.getElementById("shortened-urls");
            list.innerHTML = "";
            for (const [shortcode,url] of Object.entries(links)) {
                const li = document.createElement("li");
                const truncatedURl = url.length >= 30 ? `${url.slice(0,30)}...` : url; 
                li.innerHTML = `<a href="/${shortcode}" style="color:yellow;" target="_blank">${window.location.origin}/${shortcode}</a> - ${truncatedURl}`;
                list.appendChild(li);
            }
        }

        document.getElementById('shorten-form').addEventListener('submit',async (event)=>{
            event.preventDefault();
            const formData = new FormData(event.target);
            const url = formData.get('url');
            const shortcode = formData.get('shortcode');
            console.log(url,shortcode);

            try {
                const response = await fetch("/shorten",{
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({url,shortcode})
                });

                if (response.ok) {
                    fetchShortenedURL();
                    alert("Form submited successfully");
                    event.target.reset();
                }else{
                    const errorMessage = await response.text();
                    alert(errorMessage);
                }
            } catch (error) {
                console.log(error);
            }
        })

        fetchShortenedURL();
    </script>
</body>
</html>
